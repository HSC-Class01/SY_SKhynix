name: Update SK Hynix Financial Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 1 * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch DART financial data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python dart_api.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sk_hynix_financials.csv
          git diff --cached --quiet || git commit -m "Update SK Hynix financial data"
          git push
