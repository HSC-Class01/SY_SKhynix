name: SK hynix DART dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "dashboard-data.js"
      - "docs/dashboard-data.js"
  workflow_dispatch:
  schedule:
    # 매월 1일 00:15 UTC (한국시간 09:15)
    - cron: "15 0 1 * *"

permissions:
  contents: write

concurrency:
  group: dart-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify pipeline tests
        run: python -m unittest discover -s tests
      - name: Check OpenDART API key
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        run: |
          if [ -z "$OPENDART_API_KEY" ]; then
            echo "Add OPENDART_API_KEY in Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
      - name: Collect OpenDART statements
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        run: python -m src.collect
      - name: Calculate financial metrics
        run: python -m src.analyze
      - name: Build dashboard data
        run: python -m src.dashboard
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboard-data.js docs/dashboard-data.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh SK hynix DART data"
            git push
          fi
